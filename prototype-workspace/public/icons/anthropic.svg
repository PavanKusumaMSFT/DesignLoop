<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="40" fill="#D4845A"/>
  <g transform="translate(100,100)">
    <!-- 12 rays radiating from center -->
    <g fill="#FAEAE2">
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(0)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(30)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(60)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(90)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(120)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(150)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(180)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(210)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(240)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(270)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(300)"/>
      <rect x="-5" y="-70" width="10" height="55" rx="4" transform="rotate(330)"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="#FAEAE2"/>
  </g>
</svg>
