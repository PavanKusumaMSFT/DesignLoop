name: Azure Static Web Apps CI/CD

# Hosts prototype-workspace/ on Azure Static Web Apps.
# - Push to main  -> deploys to the live (production) environment.
# - Pull request  -> deploys an isolated per-PR preview environment.
# - PR closed      -> tears down that preview environment.
# The workspace is a Next.js static export; we build it explicitly with pnpm
# and let SWA upload the generated `out/` folder (skip_app_build: true).

on:
  push:
    branches:
      - main
    paths:
      - "prototype-workspace/**"
      - ".github/workflows/azure-static-web-apps-wonderful-pebble-01cf3a110.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "prototype-workspace/**"
      - ".github/workflows/azure-static-web-apps-wonderful-pebble-01cf3a110.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    defaults:
      run:
        working-directory: prototype-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: prototype-workspace/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          # Public MSAL config (safe to expose). Set as repository variables.
          NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_CLIENT_ID }}
          NEXT_PUBLIC_MICROSOFT_TENANT_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_TENANT_ID }}
          NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ${{ vars.NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN }}
        run: pnpm build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_PEBBLE_01CF3A110 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # We build above; SWA just uploads the pre-built static export.
          # With skip_app_build, output_location is ignored and app_location
          # must point directly at the folder containing index.html (out/).
          skip_app_build: true
          app_location: "prototype-workspace/out" # Pre-built static export
          api_location: "prototype-workspace/api" # Azure Functions (prototype shares API)
          output_location: "" # Not used when skip_app_build is true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_PEBBLE_01CF3A110 }}
          action: "close"
