name: Deploy Prototype Workspace

# Hosts prototype-workspace/ on Azure Static Web Apps.
# - Push to main  -> deploys to the live (production) environment.
# - Pull request  -> deploys an isolated per-PR preview environment.
# - PR closed      -> tears down that preview environment.
# Only changes under prototype-workspace/ (or this workflow) trigger a deploy.

on:
  push:
    branches: [main]
    paths:
      - "prototype-workspace/**"
      - ".github/workflows/deploy-prototype-workspace.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "prototype-workspace/**"
      - ".github/workflows/deploy-prototype-workspace.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    defaults:
      run:
        working-directory: prototype-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: prototype-workspace/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          # Public MSAL config (safe to expose). Set as repository variables.
          NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_CLIENT_ID }}
          NEXT_PUBLIC_MICROSOFT_TENANT_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_TENANT_ID }}
          NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: ${{ vars.NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN }}
        run: pnpm build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # We build ourselves above; SWA just uploads the exported files.
          skip_app_build: true
          app_location: "prototype-workspace"
          output_location: "out"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Preview Environment
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
