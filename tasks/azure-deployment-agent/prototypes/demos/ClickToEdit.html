<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClickToEdit Demo</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary-500: #3B82F6;
  --color-neutral-50: #F9FAFB; --color-neutral-100: #F3F4F6; --color-neutral-200: #E5E7EB;
  --color-neutral-700: #374151; --color-neutral-900: #111827;
  --color-success-500: #22C55E; --color-error-500: #EF4444;
  --border-radius-sm: 6px;
  --spacing-xs: 4px; --spacing-sm: 8px;
  --font-size-xs: 0.75rem; --font-size-sm: 0.875rem; --font-size-base: 1rem;
  --font-weight-medium: 500;
  --motion-duration-fast: 150ms;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.demo-wrapper { display: flex; flex-direction: column; gap: 32px; max-width: 480px; width: 100%; }
.demo-label { font-size: 0.75rem; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; margin-bottom: 4px; }
.demo-card { background: var(--color-neutral-50); border: 1px solid var(--color-neutral-200); border-radius: 10px; padding: 20px; }
.demo-card h3 { font-size: 0.9rem; font-weight: 600; color: var(--color-neutral-700); margin-bottom: 12px; }
.demo-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
.demo-row-label { font-size: var(--font-size-sm); color: var(--color-neutral-700); font-weight: 500; min-width: 100px; }

/* ClickToEdit styles */
.cte-display {
  display: inline-flex; align-items: center; gap: var(--spacing-xs);
  padding: var(--spacing-xs) var(--spacing-sm); border-radius: var(--border-radius-sm);
  font-size: var(--font-size-base); color: var(--color-neutral-900);
  cursor: pointer; min-height: 36px; transition: background 150ms; position: relative;
}
.cte-display:hover:not(.cte-readonly) { background: var(--color-neutral-100); }
.cte-display:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 2px; }
.cte-pencil { opacity: 0; font-size: var(--font-size-sm); transition: opacity 150ms; }
.cte-display:hover .cte-pencil, .cte-display:focus-visible .cte-pencil { opacity: 1; }
.cte-readonly { cursor: default; }
.cte-readonly:hover { background: transparent; }
.cte-updated { animation: flashGreen 300ms ease-out; }
.cte-updatedBadge { font-size: var(--font-size-xs); color: var(--color-success-500); font-weight: 500; }

.cte-editContainer { display: flex; flex-direction: column; gap: var(--spacing-xs); }
.cte-editLabel { font-size: var(--font-size-xs); font-weight: 500; color: var(--color-neutral-700); }
.cte-editRow { display: flex; align-items: center; gap: var(--spacing-xs); }
.cte-input {
  padding: var(--spacing-xs) var(--spacing-sm); border: 2px solid var(--color-primary-500);
  border-radius: var(--border-radius-sm); font-size: var(--font-size-base); color: var(--color-neutral-900);
  background: var(--color-neutral-50); min-height: 36px; outline: none; font-family: inherit;
}
.cte-input:focus { box-shadow: 0 0 0 1px var(--color-primary-500); }
.cte-inputError { border-color: var(--color-error-500); }
.cte-inputError:focus { box-shadow: 0 0 0 1px var(--color-error-500); }
.cte-confirmBtn, .cte-cancelBtn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border: 1px solid var(--color-neutral-200);
  border-radius: var(--border-radius-sm); background: var(--color-neutral-50);
  cursor: pointer; font-size: var(--font-size-sm); font-family: inherit; transition: background 150ms;
}
.cte-confirmBtn:hover:not(:disabled) { background: var(--color-neutral-100); }
.cte-cancelBtn:hover { background: var(--color-neutral-100); }
.cte-errorMsg { font-size: var(--font-size-xs); color: var(--color-error-500); }
.cte-impact { font-size: var(--font-size-xs); color: var(--color-primary-500); padding: 4px 8px; background: rgba(59,130,246,0.06); border-radius: var(--border-radius-sm); }
select.cte-input { appearance: auto; }

@keyframes flashGreen { 0% { background: rgba(34,197,94,0.15); } 100% { background: transparent; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

function ClickToEdit({ value, type = 'text', options = [], onSave, label, impactPreview, readOnly = false, validation }) {
  const [editing, setEditing] = useState(false);
  const [editValue, setEditValue] = useState(String(value));
  const [error, setError] = useState(undefined);
  const [showUpdated, setShowUpdated] = useState(false);
  const inputRef = useRef(null);
  const containerRef = useRef(null);

  useEffect(() => {
    if (editing && inputRef.current) {
      inputRef.current.focus();
      if (inputRef.current.select) inputRef.current.select();
    }
  }, [editing]);

  const enterEdit = () => {
    if (readOnly) return;
    setEditValue(String(value));
    setError(undefined);
    setEditing(true);
  };

  const cancel = () => {
    setEditing(false);
    setEditValue(String(value));
    setError(undefined);
    containerRef.current?.focus();
  };

  const confirm = () => {
    const parsed = type === 'number' ? Number(editValue) : editValue;
    if (validation) {
      const result = validation(parsed);
      if (!result.valid) { setError(result.message || 'Invalid'); return; }
    }
    onSave(parsed);
    setEditing(false);
    setError(undefined);
    setShowUpdated(true);
    setTimeout(() => setShowUpdated(false), 1500);
    containerRef.current?.focus();
  };

  const handleInputKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); confirm(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  };

  const hasChanged = String(editValue) !== String(value);

  if (editing) {
    return (
      <div className="cte-editContainer">
        <label className="cte-editLabel">{label}</label>
        <div className="cte-editRow">
          {type === 'select' ? (
            <select ref={inputRef} className={`cte-input ${error ? 'cte-inputError' : ''}`}
              value={editValue} onChange={e => { setEditValue(e.target.value); setError(undefined); }} onKeyDown={handleInputKey}>
              {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
            </select>
          ) : (
            <input ref={inputRef} className={`cte-input ${error ? 'cte-inputError' : ''}`}
              type={type} value={editValue}
              onChange={e => { setEditValue(e.target.value); setError(undefined); }}
              onKeyDown={handleInputKey} />
          )}
          <button className="cte-confirmBtn" onClick={confirm} disabled={!!error}>✓</button>
          <button className="cte-cancelBtn" onClick={cancel}>✕</button>
        </div>
        {error && <p className="cte-errorMsg" role="alert">{error}</p>}
        {impactPreview && hasChanged && !error && <div className="cte-impact">{impactPreview}</div>}
      </div>
    );
  }

  return (
    <div ref={containerRef}
      className={`cte-display ${readOnly ? 'cte-readonly' : ''} ${showUpdated ? 'cte-updated' : ''}`}
      role={readOnly ? undefined : 'button'} tabIndex={readOnly ? undefined : 0}
      onClick={enterEdit} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterEdit(); } }}
      aria-label={readOnly ? `${label}: ${value}` : `${label}: ${value}. Click to edit`}>
      <span>{value}</span>
      {!readOnly && <span className="cte-pencil" aria-hidden="true">✏️</span>}
      {showUpdated && <span className="cte-updatedBadge">Updated</span>}
    </div>
  );
}

function App() {
  const [vmName, setVmName] = useState('web-app-prod-01');
  const [sku, setSku] = useState('Standard_D4s_v3');
  const [replicas, setReplicas] = useState(3);
  const [region, setRegion] = useState('West US 2');

  return (
    <div className="demo-wrapper">
      <div>
        <div className="demo-label">Interactive — Click values to edit</div>
        <div className="demo-card">
          <h3>Azure VM Configuration</h3>
          <div className="demo-row">
            <span className="demo-row-label">Name</span>
            <ClickToEdit value={vmName} label="VM Name" onSave={setVmName}
              validation={v => v.length < 3 ? { valid: false, message: 'Min 3 characters' } : { valid: true }} />
          </div>
          <div className="demo-row">
            <span className="demo-row-label">SKU</span>
            <ClickToEdit value={sku} label="SKU" type="select"
              options={['Standard_D2s_v3', 'Standard_D4s_v3', 'Standard_D8s_v3', 'Standard_E4s_v3']}
              onSave={setSku} impactPreview="Cost impact: ~$96–$384/mo depending on SKU" />
          </div>
          <div className="demo-row">
            <span className="demo-row-label">Replicas</span>
            <ClickToEdit value={replicas} label="Replicas" type="number" onSave={setReplicas}
              impactPreview={`Cost scales linearly: ~$${192 * replicas}/mo`}
              validation={v => v < 1 || v > 10 ? { valid: false, message: 'Must be 1–10' } : { valid: true }} />
          </div>
          <div className="demo-row">
            <span className="demo-row-label">Region</span>
            <ClickToEdit value={region} label="Region" type="select"
              options={['East US', 'West US 2', 'West Europe', 'Southeast Asia']}
              onSave={setRegion} />
          </div>
          <div className="demo-row" style={{ borderBottom: 'none' }}>
            <span className="demo-row-label">Resource ID</span>
            <ClickToEdit value="/subscriptions/abc-123/..." label="Resource ID" readOnly />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
