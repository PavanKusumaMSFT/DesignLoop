<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Task — Design Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://static2.sharepointonline.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">

<div class="app">

          <img src="assets/designloop-logo.svg" alt="Design Loop Logo" class="sidebar-logo-mark" width="30" height="30" style="cursor:pointer" onclick="goHome()">

      </div>

    </div>

  <main class="main">
    <header class="topbar" id="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">&#9776;</button>
      <div class="breadcrumb" id="breadcrumb">
        <span class="crumb-active">Task</span>
