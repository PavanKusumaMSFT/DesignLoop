<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool — Design Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://static2.sharepointonline.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="app">
  <!-- GLOBAL SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-row">
        <div class="sidebar-logo">
          <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.178 8c-3.418 0-4.764 8-8.356 8a4 4 0 0 1 0-8c3.592 0 4.938 8 8.356 8a4 4 0 0 0 0-8z"/></svg></div>
          <span class="sidebar-logo-text" style="cursor:pointer" onclick="goHome()">Design Loop</span>
        </div>
        <button class="rail-toggle" onclick="toggleRail()" aria-label="Collapse sidebar" title="Collapse / expand sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
    </div>
    <nav class="global-nav" id="globalNav"></nav>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar" id="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">&#9776;</button>
      <div class="breadcrumb" id="breadcrumb">
        <span style="cursor:pointer" onclick="goHome()">Home</span>
        <span>&#8250;</span>
        <span class="crumb-active">Tool</span>
      </div>
    </header>
    <div class="content-area" id="toolContent"></div>
  </main>
</div>

<script src="assets/app.js"></script>
<script>initToolPage();</script>
</body>
</html>
